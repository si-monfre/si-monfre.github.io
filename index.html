<style>
  html,body{margin:0;height:100%;background:#faf7f2;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:#8a5a2b;text-align:center}
  #loading img{width:min(420px,80vw);height:auto;margin-bottom:14px}
</style>

<body>
<div id="loading"><div><img src="logo.png?v=3" alt="Monfre Studio"><br><small id="msg">Memuat aplikasi...</small></div></div>
<!-- URL Aplikasi Web Apps Script SIMONFRÉ (deployment aktif) -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzeJGj5eF_MBaNJWPkCJysB2p0PLfp4i1ur4UyASo8RHzivRJxMFlIRzGyBsU-N7NhX/exec"
  allow="clipboard-write" onload="document.getElementById('loading').style.display='none'"></iframe>
<script>
  // link nota pelanggan: si-monfre.github.io/?nota=KODE diteruskan ke halaman nota online
  (function () {
    var q = location.search || '';
    if (/[?&]nota=/.test(q)) {
      var f = document.getElementById('app');
      f.src = f.src.split('?')[0] + q;
      document.title = 'Nota Digital Monfre Studio';
      document.getElementById('msg').textContent = 'Memuat nota digital...';
    } else document.title = 'SuperApp Monfre Studio';
  })();
  // kalau lebih dari 20 detik belum tampil, beri petunjuk
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (l && l.style.display !== 'none') document.getElementById('msg').innerHTML = 'Masih memuat... Kalau tidak muncul juga, muat ulang halaman (Ctrl+F5).';
  }, 20000);
</script>
</body>
